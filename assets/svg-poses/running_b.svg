<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-80 -100 160 180" width="320" height="360">
<style>
  .char-head { fill: none; stroke: currentColor; stroke-width: 3; }
  .char-eyes { fill: currentColor; }
  .char-body { fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
</style>
<g color="#333333">
<circle cx="0" cy="-60" r="18" class="char-head" />
<circle cx="-6" cy="-63" r="2" class="char-eyes" />
<circle cx="6" cy="-63" r="2" class="char-eyes" />
<!-- Torso (forward lean) -->
<line x1="0" y1="-42" x2="3" y2="0" class="char-body" />
<!-- Arms (opposite pump) -->
<path d="M 0 -37 L 15 -32 L 10 -22" class="char-body" />    <!-- right arm back -->
<path d="M 0 -37 L -22 -30 L -18 -20" class="char-body" />  <!-- left arm forward -->
<!-- Legs (wide stride) -->
<path d="M 0 0 L 22 22 L 28 45" class="char-body" />        <!-- right leg extended forward -->
<path d="M 0 0 L -15 25 L -22 48" class="char-body" />      <!-- left leg pushing off behind -->
</g>
</svg>
