<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-80 -100 160 180" width="320" height="360">
<style>
  .char-head { fill: none; stroke: currentColor; stroke-width: 3; }
  .char-eyes { fill: currentColor; }
  .char-body { fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
</style>
<g color="#333333">
<circle cx="0" cy="-60" r="18" class="char-head" />
<circle cx="-6" cy="-63" r="2" class="char-eyes" />
<circle cx="6" cy="-63" r="2" class="char-eyes" />
<!-- Torso -->
<line x1="0" y1="-42" x2="0" y2="0" class="char-body" />
<!-- Arms -->
<path d="M 0 -37 L 12 -18 L 5 -5" class="char-body" />     <!-- right arm trailing back -->
<path d="M 0 -37 L -15 -22 L -22 -12" class="char-body" />  <!-- left arm swinging forward -->
<!-- Legs -->
<path d="M 0 0 L 18 28 L 22 50" class="char-body" />        <!-- right leg forward (knee bent ahead) -->
<path d="M 0 0 L -12 32 L -8 53" class="char-body" />       <!-- left leg back (pushing off) -->
</g>
</svg>
